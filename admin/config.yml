backend:
  name: git-gateway
  branch: main  # Mets ici le nom de ta branche principale (main ou master)

media_folder: "assets/img"  # Emplacement des images
public_folder: "/img"

collections:
  - name: "posts"
    label: "Articles"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Catégories", name: "categories", widget: "list" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Corps", name: "body", widget: "markdown" }
